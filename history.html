<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History | Life Tempo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <h1>🧭 Life Tempo</h1>
    <nav>
      <a href="index.html">Today</a>
      <a href="plan.html">Plan</a>
      <a href="history.html" aria-current="page">History</a>
      <a href="trips.html">Trips</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="engagement.html">Engagement</a>
      <a href="reports.html">Reports</a>
      <a href="manage.html">Manage</a>
    </nav>
  </div>
</header>

<main>
  <div id="status"></div>
  <div id="content"><p class="note">Loading…</p></div>
</main>

<footer class="site-footer">Life Tempo — Phase 7: Travel, Contract Work, and CSV Export</footer>

<script src="js/api.js"></script>
<script>
const statusEl = document.getElementById('status');
const contentEl = document.getElementById('content');

let ACTIVITIES = [];
let LOCATIONS = [];
let PEOPLE = [];
let TAGS = [];
let LEARNING_PROJECTS = [];
let CLIENTS = [];
let CURRENT_ENTRIES = [];
let PREFS = { ShowTravel: true, ShowBillable: true };
let editingId = null;

function showStatus(msg) {
  if (!msg) { statusEl.style.display = 'none'; return; }
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
}

function activeLocations() { return LOCATIONS.filter(l => l.Active); }

function optionsHtml(items, valueKey, labelKey, selected) {
  return items.map(i => `<option value="${i[valueKey]}" ${String(i[valueKey]) === String(selected) ? 'selected' : ''}>${escapeHtml(i[labelKey])}</option>`).join('');
}

function defaultFrom() {
  const d = new Date();
  d.setDate(d.getDate() - 30);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function renderShell() {
  contentEl.innerHTML = `
    <div class="card">
      <h3>Filter</h3>
      <div class="form-grid">
        <div>
          <label for="flt-activity">Activity</label>
          <select id="flt-activity"><option value="">All activities</option>${optionsHtml(ACTIVITIES, 'Id', 'Name')}</select>
        </div>
        <div>
          <label for="flt-from">From</label>
          <input type="date" id="flt-from" value="${defaultFrom()}">
        </div>
        <div>
          <label for="flt-to">To</label>
          <input type="date" id="flt-to" value="${todayStr()}">
        </div>
      </div>
      <p>
        <button type="button" class="btn" id="flt-apply">Apply</button>
        <button type="button" class="btn secondary" id="flt-export">Download CSV</button>
      </p>
    </div>

    <div class="card" id="edit-card" style="display:none;">
      <h3>Edit Entry</h3>
      <form id="log-form">
        <label for="f-activity">Activity</label>
        <select id="f-activity" required>${optionsHtml(ACTIVITIES.filter(a => a.Active), 'Id', 'Name')}</select>

        <div class="form-grid">
          <div>
            <label for="f-date">Date</label>
            <input type="date" id="f-date">
          </div>
          <div>
            <label for="f-start">Start time</label>
            <input type="time" id="f-start">
          </div>
          <div>
            <label for="f-end">End time</label>
            <input type="time" id="f-end">
          </div>
          <div>
            <label for="f-duration">Or duration (min)</label>
            <input type="number" id="f-duration" min="0">
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label for="f-location">Location</label>
            <select id="f-location">
              <option value="">(none)</option>
              ${optionsHtml(activeLocations(), 'Id', 'Name')}
            </select>
          </div>
          <div>
            <label for="f-cost">Cost</label>
            <input type="number" id="f-cost" min="0" step="0.01">
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label for="f-people">With</label>
            ${multiSelectHtml('f-people', PEOPLE.filter(p => p.Active), 'Id', 'DisplayName', [])}
          </div>
          <div>
            <label for="f-tags">Tags</label>
            ${multiSelectHtml('f-tags', TAGS.filter(t => t.Active), 'Id', 'Name', [])}
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label for="f-learning-project">Learning project</label>
            <select id="f-learning-project">
              <option value="">(none)</option>
              ${optionsHtml(LEARNING_PROJECTS.filter(lp => lp.Active), 'Id', 'Name')}
            </select>
          </div>
          <div>
            <label for="f-learning-mode">Learning mode</label>
            <select id="f-learning-mode">
              <option value="Learn">Learn</option>
              <option value="Apply">Apply</option>
            </select>
          </div>
          ${PREFS.ShowBillable ? `
          <div>
            <label for="f-client">Client (if billable)</label>
            <select id="f-client">
              <option value="">(none)</option>
              ${optionsHtml(CLIENTS.filter(c => c.Active), 'Id', 'Name')}
            </select>
          </div>` : ''}
        </div>

        <label for="f-notes">Notes</label>
        <textarea id="f-notes"></textarea>

        <div class="checkline">
          <input type="checkbox" id="f-productive">
          <label for="f-productive">Productive</label>
        </div>
        <div class="checkline">
          <input type="checkbox" id="f-billable">
          <label for="f-billable">Billable</label>
        </div>
        <div class="checkline">
          <input type="checkbox" id="f-shared-life">
          <label for="f-shared-life">Shared Life (intentionally done together)</label>
        </div>

        <p>
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn secondary" id="f-cancel">Cancel</button>
        </p>
      </form>
    </div>

    <div class="card">
      <div id="log-list"></div>
    </div>
  `;

  document.getElementById('flt-apply').addEventListener('click', loadEntries);
  document.getElementById('flt-export').addEventListener('click', exportCsv);
  document.getElementById('log-form').addEventListener('submit', onSubmit);
  document.getElementById('f-cancel').addEventListener('click', closeEdit);
}

function exportCsv() {
  if (!CURRENT_ENTRIES.length) { showStatus('Nothing to export in this range.'); return; }
  const columns = [
    { label: 'Date', value: 'ActivityDate' },
    { label: 'Activity', value: 'ActivityName' },
    { label: 'Start', value: e => timeOnly(e.StartTime) },
    { label: 'End', value: e => timeOnly(e.EndTime) },
    { label: 'Minutes', value: 'DurationMinutes' },
    { label: 'Location', value: 'LocationName' },
    { label: 'Productive', value: e => e.Productive ? 'Yes' : 'No' },
    { label: 'Billable', value: e => e.Billable ? 'Yes' : 'No' },
    ...(PREFS.ShowBillable ? [{ label: 'Client', value: 'ClientName' }] : []),
    { label: 'Cost', value: 'CostAmount' },
    { label: 'Shared Life', value: e => e.SharedLife ? 'Yes' : 'No' },
    { label: 'With', value: e => (e.PersonNames || []).join('; ') },
    { label: 'Tags', value: e => (e.TagNames || []).join('; ') },
    { label: 'Notes', value: 'Notes' },
  ];
  downloadCsv(`life-tempo-activity-log.csv`, columns, CURRENT_ENTRIES);
}

function renderList(entries) {
  const list = document.getElementById('log-list');
  list.innerHTML = '';
  if (!entries.length) {
    list.innerHTML = '<p class="note">No activity logged in this range.</p>';
    return;
  }
  groupByDate(entries).forEach(group => {
    const heading = document.createElement('div');
    heading.className = 'day-heading';
    heading.textContent = formatDateHeading(group.date);
    list.appendChild(heading);
    group.entries.forEach(e => list.appendChild(logRowEl(e, startEdit, confirmDelete)));
  });
}

function startEdit(entry) {
  editingId = entry.Id;
  document.getElementById('edit-card').style.display = 'block';
  document.getElementById('f-activity').value = entry.ActivityId;
  document.getElementById('f-date').value = entry.ActivityDate;
  document.getElementById('f-start').value = timeOnly(entry.StartTime);
  document.getElementById('f-end').value = timeOnly(entry.EndTime);
  document.getElementById('f-duration').value = entry.DurationMinutes ?? '';
  document.getElementById('f-location').value = entry.LocationId ?? '';
  document.getElementById('f-cost').value = entry.CostAmount ?? '';
  document.getElementById('f-notes').value = entry.Notes || '';
  document.getElementById('f-productive').checked = !!entry.Productive;
  document.getElementById('f-billable').checked = !!entry.Billable;
  document.getElementById('f-shared-life').checked = !!entry.SharedLife;
  document.getElementById('f-learning-project').value = entry.LearningProjectId ?? '';
  document.getElementById('f-learning-mode').value = entry.LearningMode || 'Learn';
  if (PREFS.ShowBillable) document.getElementById('f-client').value = entry.ClientId ?? '';
  setMultiSelectValues('f-people', entry.PersonIds || []);
  setMultiSelectValues('f-tags', entry.TagIds || []);
  document.getElementById('edit-card').scrollIntoView({ behavior: 'smooth' });
}

function setMultiSelectValues(id, ids) {
  const set = new Set((ids || []).map(String));
  Array.from(document.getElementById(id).options).forEach(o => { o.selected = set.has(o.value); });
}

function closeEdit() {
  editingId = null;
  document.getElementById('edit-card').style.display = 'none';
  document.getElementById('log-form').reset();
}

async function confirmDelete(entry) {
  if (!confirm(`Delete this "${entry.ActivityName}" entry? This cannot be undone.`)) return;
  try {
    await postAction('deleteActivityLog', { id: entry.Id });
    await loadEntries();
  } catch (e) {
    showStatus("Couldn't delete that entry. Try again.");
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  if (!editingId) return;
  const activityId = Number(document.getElementById('f-activity').value);
  if (!activityId) { showStatus('Choose an activity first.'); return; }
  const payload = {
    activityId,
    activityDate: document.getElementById('f-date').value,
    startTime: document.getElementById('f-start').value,
    endTime: document.getElementById('f-end').value,
    durationMinutes: document.getElementById('f-duration').value,
    locationId: document.getElementById('f-location').value,
    costAmount: document.getElementById('f-cost').value,
    notes: document.getElementById('f-notes').value,
    productive: document.getElementById('f-productive').checked,
    billable: document.getElementById('f-billable').checked,
    sharedLife: document.getElementById('f-shared-life').checked,
    learningProjectId: document.getElementById('f-learning-project').value,
    learningMode: document.getElementById('f-learning-mode').value,
    clientId: PREFS.ShowBillable ? document.getElementById('f-client').value : '',
    personIds: selectedValues(document.getElementById('f-people')),
    tagIds: selectedValues(document.getElementById('f-tags')),
  };
  const btn = ev.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  showStatus('');
  try {
    await postAction('updateActivityLog', { id: editingId, ...payload });
    showStatus('Entry updated.');
    closeEdit();
    await loadEntries();
  } catch (e) {
    showStatus("Couldn't save that entry. Try again.");
  }
  btn.disabled = false;
}

async function loadEntries() {
  const from = document.getElementById('flt-from').value || defaultFrom();
  const to = document.getElementById('flt-to').value || todayStr();
  const activityId = document.getElementById('flt-activity').value;
  const params = { from, to };
  if (activityId) params.activityId = activityId;
  const res = await fetchData('activityLog', params);
  CURRENT_ENTRIES = (res && res.entries) || [];
  renderList(CURRENT_ENTRIES);
}

async function load() {
  try {
    const [actRes, locRes, personRes, tagRes, lpRes, clientRes, prefs] = await Promise.all([
      fetchData('activities'), fetchData('locations'),
      fetchData('people'), fetchData('tags'), fetchData('learningProjects'), fetchData('clients'),
      loadPreferences(),
    ]);
    ACTIVITIES = (actRes && actRes.activities) || [];
    LOCATIONS = (locRes && locRes.locations) || [];
    PEOPLE = (personRes && personRes.people) || [];
    TAGS = (tagRes && tagRes.tags) || [];
    LEARNING_PROJECTS = (lpRes && lpRes.learningProjects) || [];
    CLIENTS = (clientRes && clientRes.clients) || [];
    PREFS = prefs;
    applyNavVisibility(PREFS);
    renderShell();
    await loadEntries();
  } catch (e) {
    handleError(contentEl, e);
  }
}

(async () => {
  await captureSso();
  await load();
})();
</script>

</body>
</html>
