<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today | Life Tempo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <h1>🧭 Life Tempo</h1>
    <nav>
      <a href="index.html" aria-current="page">Today</a>
      <a href="plan.html">Plan</a>
      <a href="history.html">History</a>
      <a href="trips.html">Trips</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="engagement.html">Engagement</a>
      <a href="reports.html">Reports</a>
      <a href="manage.html">Manage</a>
    </nav>
  </div>
</header>

<main>
  <div id="status"></div>
  <div id="content"><p class="note">Loading…</p></div>
</main>

<footer class="site-footer">Life Tempo — Phase 7: Travel, Contract Work, and CSV Export</footer>

<script src="js/api.js"></script>
<script>
const statusEl = document.getElementById('status');
const contentEl = document.getElementById('content');

let ACTIVITIES = [];
let LOCATIONS = [];
let PEOPLE = [];
let TAGS = [];
let LEARNING_PROJECTS = [];
let CLIENTS = [];
let UPCOMING = [];
let editingId = null;
let DAY_STATUS = { DayType: 'Home' };
let PREFS = { ShowTravel: true, ShowBillable: true };

const DAY_TYPES = ['Home', 'Local Outing', 'Travel', 'Vacation', 'Sick', 'Special Event'];

function showStatus(msg) {
  if (!msg) { statusEl.style.display = 'none'; return; }
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
}

function activeActivities() { return ACTIVITIES.filter(a => a.Active); }
function activeLocations() { return LOCATIONS.filter(l => l.Active); }

function optionsHtml(items, valueKey, labelKey, selected) {
  return items.map(i => `<option value="${i[valueKey]}" ${String(i[valueKey]) === String(selected) ? 'selected' : ''}>${escapeHtml(i[labelKey])}</option>`).join('');
}

function formatUpcomingWhen(startDateTime) {
  const [datePart] = startDateTime.split(' ');
  const heading = formatDateHeading(datePart);
  return `${heading} · ${formatTime12h(startDateTime)}`;
}

function renderShell(todayEntries) {
  const quickLogActivities = activeActivities().filter(a => a.QuickLog);

  contentEl.innerHTML = `
    ${ACTIVITIES.length === 0 ? `
      <div class="note">
        No activities yet — add one on <a href="manage.html">Manage</a> before you can log anything.
      </div>` : ''}

    <div class="card">
      <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
        <strong>Today is a:</strong>
        <select id="day-type">${DAY_TYPES.map(t => `<option value="${t}" ${t === DAY_STATUS.DayType ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button type="button" class="btn secondary" id="day-save">Save</button>
      </div>
      <p class="note" style="margin-top:0.6rem;">Travel/Vacation/Sick days won't count against Daily-cadence goals like practice or exercise (see Dashboard).</p>
    </div>

    ${UPCOMING.length ? `
      <div class="card">
        <h3>Coming Up</h3>
        ${UPCOMING.slice(0, 3).map(ev => `
          <div class="log-row">
            <div class="lr-main">
              <div class="lr-activity">${escapeHtml(ev.Title)}</div>
              <div class="lr-meta">${escapeHtml(formatUpcomingWhen(ev.StartDateTime))}${ev.LocationName ? ' · ' + locationLinkHtml(ev.LocationName, ev.LocationAddress) : ''}</div>
            </div>
          </div>`).join('')}
        <p><a href="plan.html">See all planned events →</a></p>
      </div>` : ''}

    ${quickLogActivities.length ? `
      <div class="card">
        <h3>Quick Log</h3>
        <div class="quick-log-strip">
          ${quickLogActivities.map(a => `<button type="button" class="btn accent" data-quick="${a.Id}">${escapeHtml(a.Name)} ✓</button>`).join('')}
        </div>
      </div>` : ''}

    <div class="card">
      <h3 id="form-heading">Log an Activity</h3>
      <form id="log-form">
        <input type="hidden" id="f-id">
        <label for="f-activity">Activity</label>
        <select id="f-activity" required>
          <option value="">Select an activity…</option>
          ${optionsHtml(activeActivities(), 'Id', 'Name')}
        </select>

        <div class="form-grid">
          <div>
            <label for="f-date">Date</label>
            <input type="date" id="f-date" value="${todayStr()}">
          </div>
          <div>
            <label for="f-start">Start time</label>
            <input type="time" id="f-start">
          </div>
          <div>
            <label for="f-end">End time</label>
            <input type="time" id="f-end">
          </div>
          <div>
            <label for="f-duration">Or duration (min)</label>
            <input type="number" id="f-duration" min="0">
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label for="f-location">Location</label>
            <select id="f-location">
              <option value="">(none)</option>
              ${optionsHtml(activeLocations(), 'Id', 'Name')}
            </select>
          </div>
          <div>
            <label for="f-cost">Cost</label>
            <input type="number" id="f-cost" min="0" step="0.01">
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label for="f-people">With</label>
            ${multiSelectHtml('f-people', PEOPLE.filter(p => p.Active), 'Id', 'DisplayName', [])}
          </div>
          <div>
            <label for="f-tags">Tags</label>
            ${multiSelectHtml('f-tags', TAGS.filter(t => t.Active), 'Id', 'Name', [])}
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label for="f-learning-project">Learning project</label>
            <select id="f-learning-project">
              <option value="">(none)</option>
              ${optionsHtml(LEARNING_PROJECTS.filter(lp => lp.Active), 'Id', 'Name')}
            </select>
          </div>
          <div>
            <label for="f-learning-mode">Learning mode</label>
            <select id="f-learning-mode">
              <option value="Learn">Learn</option>
              <option value="Apply">Apply</option>
            </select>
          </div>
          ${PREFS.ShowBillable ? `
          <div>
            <label for="f-client">Client (if billable)</label>
            <select id="f-client">
              <option value="">(none)</option>
              ${optionsHtml(CLIENTS.filter(c => c.Active), 'Id', 'Name')}
            </select>
          </div>` : ''}
        </div>

        <label for="f-notes">Notes</label>
        <textarea id="f-notes"></textarea>

        <div class="checkline">
          <input type="checkbox" id="f-productive">
          <label for="f-productive">Productive</label>
        </div>
        <div class="checkline">
          <input type="checkbox" id="f-billable">
          <label for="f-billable">Billable</label>
        </div>
        <div class="checkline">
          <input type="checkbox" id="f-shared-life">
          <label for="f-shared-life">Shared Life (intentionally done together)</label>
        </div>

        <p>
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn secondary" id="f-cancel" style="display:none;">Cancel edit</button>
        </p>
      </form>
    </div>

    <div class="card">
      <h3>Today</h3>
      <div id="today-list"></div>
    </div>
  `;

  contentEl.querySelectorAll('[data-quick]').forEach(btn => {
    btn.addEventListener('click', () => quickLog(Number(btn.dataset.quick), btn));
  });

  document.getElementById('f-activity').addEventListener('change', onActivityPicked);
  document.getElementById('log-form').addEventListener('submit', onSubmit);
  document.getElementById('f-cancel').addEventListener('click', resetForm);
  document.getElementById('day-save').addEventListener('click', onSaveDayStatus);

  renderTodayList(todayEntries);
}

function onActivityPicked() {
  if (editingId) return; // don't clobber values while editing an existing entry
  const id = Number(document.getElementById('f-activity').value);
  const a = ACTIVITIES.find(x => x.Id === id);
  if (!a) return;
  document.getElementById('f-duration').value = a.TypicalDurationMinutes ?? '';
  document.getElementById('f-location').value = a.DefaultLocationId ?? '';
  document.getElementById('f-productive').checked = !!a.Productive;
  document.getElementById('f-billable').checked = !!a.BillableEligible;
}

function renderTodayList(entries) {
  const list = document.getElementById('today-list');
  list.innerHTML = '';
  if (!entries.length) {
    list.innerHTML = '<p class="note">Nothing logged yet today.</p>';
    return;
  }
  entries.forEach(e => list.appendChild(logRowEl(e, startEdit, confirmDelete)));
}

function startEdit(entry) {
  editingId = entry.Id;
  document.getElementById('form-heading').textContent = 'Edit Activity Log Entry';
  document.getElementById('f-id').value = entry.Id;
  document.getElementById('f-activity').value = entry.ActivityId;
  document.getElementById('f-date').value = entry.ActivityDate;
  document.getElementById('f-start').value = timeOnly(entry.StartTime);
  document.getElementById('f-end').value = timeOnly(entry.EndTime);
  document.getElementById('f-duration').value = entry.DurationMinutes ?? '';
  document.getElementById('f-location').value = entry.LocationId ?? '';
  document.getElementById('f-cost').value = entry.CostAmount ?? '';
  document.getElementById('f-notes').value = entry.Notes || '';
  document.getElementById('f-productive').checked = !!entry.Productive;
  document.getElementById('f-billable').checked = !!entry.Billable;
  document.getElementById('f-shared-life').checked = !!entry.SharedLife;
  document.getElementById('f-learning-project').value = entry.LearningProjectId ?? '';
  document.getElementById('f-learning-mode').value = entry.LearningMode || 'Learn';
  if (PREFS.ShowBillable) document.getElementById('f-client').value = entry.ClientId ?? '';
  setMultiSelectValues('f-people', entry.PersonIds || []);
  setMultiSelectValues('f-tags', entry.TagIds || []);
  document.getElementById('f-cancel').style.display = 'inline-block';
  document.getElementById('form-heading').scrollIntoView({ behavior: 'smooth' });
}

function setMultiSelectValues(id, ids) {
  const set = new Set((ids || []).map(String));
  Array.from(document.getElementById(id).options).forEach(o => { o.selected = set.has(o.value); });
}

function resetForm() {
  editingId = null;
  document.getElementById('form-heading').textContent = 'Log an Activity';
  document.getElementById('log-form').reset();
  document.getElementById('f-id').value = '';
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-cancel').style.display = 'none';
}

async function confirmDelete(entry) {
  if (!confirm(`Delete this "${entry.ActivityName}" entry? This cannot be undone.`)) return;
  try {
    await postAction('deleteActivityLog', { id: entry.Id });
    await loadToday();
  } catch (e) {
    showStatus("Couldn't delete that entry. Try again.");
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  const activityId = Number(document.getElementById('f-activity').value);
  if (!activityId) { showStatus('Choose an activity first.'); return; }
  const payload = {
    activityId,
    activityDate: document.getElementById('f-date').value || todayStr(),
    startTime: document.getElementById('f-start').value,
    endTime: document.getElementById('f-end').value,
    durationMinutes: document.getElementById('f-duration').value,
    locationId: document.getElementById('f-location').value,
    costAmount: document.getElementById('f-cost').value,
    notes: document.getElementById('f-notes').value,
    productive: document.getElementById('f-productive').checked,
    billable: document.getElementById('f-billable').checked,
    sharedLife: document.getElementById('f-shared-life').checked,
    learningProjectId: document.getElementById('f-learning-project').value,
    learningMode: document.getElementById('f-learning-mode').value,
    clientId: PREFS.ShowBillable ? document.getElementById('f-client').value : '',
    personIds: selectedValues(document.getElementById('f-people')),
    tagIds: selectedValues(document.getElementById('f-tags')),
  };
  const btn = ev.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  showStatus('');
  try {
    if (editingId) {
      await postAction('updateActivityLog', { id: editingId, ...payload });
      showStatus('Entry updated.');
    } else {
      await postAction('addActivityLog', payload);
      showStatus('Logged.');
    }
    resetForm();
    await loadToday();
  } catch (e) {
    showStatus("Couldn't save that entry. Try again.");
  }
  btn.disabled = false;
}

async function onSaveDayStatus() {
  const btn = document.getElementById('day-save');
  const dayType = document.getElementById('day-type').value;
  btn.disabled = true;
  showStatus('');
  try {
    await postAction('setDayStatus', { date: todayStr(), dayType });
    DAY_STATUS.DayType = dayType;
    showStatus('Day status saved.');
  } catch (e) {
    showStatus("Couldn't save that. Try again.");
  }
  btn.disabled = false;
}

async function quickLog(activityId, btn) {
  btn.disabled = true;
  showStatus('');
  try {
    const res = await postAction('quickLog', { activityId });
    showStatus(`Logged ${res.activityName}.`);
    await loadToday();
  } catch (e) {
    showStatus("Couldn't quick-log that. Try again.");
  }
  btn.disabled = false;
}

async function loadToday() {
  const today = todayStr();
  const res = await fetchData('activityLog', { from: today, to: today });
  renderShell((res && res.entries) || []);
}

async function load() {
  try {
    const [actRes, locRes, dayRes, personRes, tagRes, lpRes, evRes, clientRes, prefs] = await Promise.all([
      fetchData('activities'), fetchData('locations'), fetchData('dayStatus'),
      fetchData('people'), fetchData('tags'), fetchData('learningProjects'),
      fetchData('plannedEvents', { status: 'Planned' }), fetchData('clients'), loadPreferences(),
    ]);
    ACTIVITIES = (actRes && actRes.activities) || [];
    LOCATIONS = (locRes && locRes.locations) || [];
    DAY_STATUS = dayRes || { DayType: 'Home' };
    PEOPLE = (personRes && personRes.people) || [];
    TAGS = (tagRes && tagRes.tags) || [];
    LEARNING_PROJECTS = (lpRes && lpRes.learningProjects) || [];
    CLIENTS = (clientRes && clientRes.clients) || [];
    PREFS = prefs;
    applyNavVisibility(PREFS);
    UPCOMING = ((evRes && evRes.events) || []).filter(e => e.StartDateTime >= nowDateTimeStr());
    await loadToday();
  } catch (e) {
    handleError(contentEl, e);
  }
}

(async () => {
  await captureSso();
  await load();
})();
</script>

</body>
</html>
