<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Life Tempo</title>
<link rel="stylesheet" href="style.css?v=20261001">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <h1>🧭 Life Tempo</h1>
    <nav>
      <a href="index.html">Today</a>
      <a href="plan.html">Plan</a>
      <a href="history.html">History</a>
      <a href="trips.html">Trips</a>
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="engagement.html">Engagement</a>
      <a href="reports.html">Reports</a>
      <a href="manage.html">Manage</a>
    </nav>
  </div>
</header>

<main>
  <div id="status"></div>
  <div id="content"><p class="note">Loading…</p></div>
</main>

<footer class="site-footer">Life Tempo — Phase 7: Travel, Contract Work, and CSV Export</footer>

<script src="js/api.js?v=20261001"></script>
<script>
const statusEl = document.getElementById('status');
const contentEl = document.getElementById('content');

function showStatus(msg) {
  if (!msg) { statusEl.style.display = 'none'; return; }
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
}

const POINT_PERIODS = [
  { key: 'Week', label: 'This Week' },
  { key: 'Rolling4Weeks', label: 'Rolling 4 Weeks' },
  { key: 'Month', label: 'This Month' },
  { key: 'Quarter', label: 'This Quarter' },
  { key: 'Year', label: 'This Year' },
];

function pointsBreakdownHtml(goals) {
  const rows = goals.map(g => `<tr>
      <td>${escapeHtml(g.Name)}${g.HasActivities ? '' : ' <em>(no activities linked)</em>'}</td>
      <td>${g.Count}</td>
      <td>&times;${g.Weight}</td>
      <td><strong>${formatPoints(g.Points)}</strong></td>
    </tr>`).join('');
  return `
    <table class="breakdown-table">
      <thead><tr><th>Goal</th><th>Done</th><th>Weight</th><th>Points</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// Same card shape as the Engagement page's score cards, showing points
// (weight x times done) instead of a percentage.
function pointsCardEl(periodLabel, pts) {
  const card = document.createElement('div');
  card.className = 'card score-card points';
  const scored = pts.Goals.filter(g => g.Count > 0);
  card.innerHTML = `
    <div class="score-num">${formatPoints(pts.Points)}</div>
    <div class="score-unit">points</div>
    <div class="score-period">${periodLabel}</div>
    ${scored.length
      ? `<p><button type="button" class="btn secondary" data-toggle style="font-size:0.8rem; padding:0.3rem 0.6rem;">Breakdown</button></p>
         <div class="breakdown" style="display:none;">${pointsBreakdownHtml(scored)}</div>`
      : ''}
  `;
  if (scored.length) {
    const btn = card.querySelector('[data-toggle]');
    const box = card.querySelector('.breakdown');
    btn.addEventListener('click', () => {
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : 'block';
      btn.textContent = open ? 'Breakdown' : 'Hide';
    });
  }
  return card;
}

function render(progress, sharedLife, points) {
  const weekly = progress.filter(p => p.CadenceType !== 'Monthly');
  const monthly = progress.filter(p => p.CadenceType === 'Monthly');
  contentEl.innerHTML = `
    ${points ? `
      <h2 style="margin-top:0;">Points</h2>
      <div class="score-grid" id="points-grid"></div>
      <p class="note" style="font-size:0.85rem;">Each time you log an activity linked to a goal, you earn that goal's weight in points — weight 5, done twice, is 10 points. Maximum (limit) goals don't earn points.</p>
    ` : ''}
    <div class="card">
      <h3>Shared Life</h3>
      <p>Entries marked "Shared Life" — <strong>${sharedLife.ThisWeek}</strong> this week, <strong>${sharedLife.ThisMonth}</strong> this month.</p>
      <p class="note">Mark a log entry "Shared Life" on Today/History when it's time intentionally spent with someone, not just them happening to be around.</p>
    </div>
    ${progress.length ? `
      <div class="card">
        <h3>This Week</h3>
        <div id="weekly-goals">${weekly.length ? '' : '<p class="note">No weekly or daily goals.</p>'}</div>
      </div>
      ${monthly.length ? `
        <div class="card">
          <h3>This Month</h3>
          <div id="monthly-goals"></div>
        </div>` : ''}
    ` : `
      <div class="note">
        No active goals yet. Add one on <a href="manage.html">Manage</a> and link it to the
        activities that should count toward it (e.g. "Exercise 5 per week" linked to your
        Gym/Walk activities).
      </div>`}
  `;
  if (points) {
    const grid = document.getElementById('points-grid');
    POINT_PERIODS.forEach(p => grid.appendChild(pointsCardEl(p.label, points[p.key])));
  }
  if (progress.length) {
    const weeklyEl = document.getElementById('weekly-goals');
    weekly.forEach(p => weeklyEl.appendChild(goalCardEl(p)));
    if (monthly.length) {
      const monthlyEl = document.getElementById('monthly-goals');
      monthly.forEach(p => monthlyEl.appendChild(goalCardEl(p)));
    }
  }
}

async function load() {
  try {
    const [progRes, sharedRes, pointsRes] = await Promise.all([
      fetchData('goalProgress'), fetchData('sharedLifeSummary'), fetchData('pointsSummary'),
    ]);
    render((progRes && progRes.progress) || [], sharedRes || { ThisWeek: 0, ThisMonth: 0 },
           pointsRes && pointsRes.summary);
  } catch (e) {
    handleError(contentEl, e);
  }
}

(async () => {
  await captureSso();
  applyNavVisibility(await loadPreferences());
  await load();
})();
</script>

</body>
</html>
