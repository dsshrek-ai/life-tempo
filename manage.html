<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage | Life Tempo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <h1>🧭 Life Tempo</h1>
    <nav>
      <a href="index.html">Today</a>
      <a href="history.html">History</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="engagement.html">Engagement</a>
      <a href="manage.html" aria-current="page">Manage</a>
    </nav>
  </div>
</header>

<main>
  <div id="status"></div>
  <div id="content"><p class="note">Loading…</p></div>
</main>

<footer class="site-footer">Life Tempo — Phase 5: Engagement Scoring and Heat Maps</footer>

<script src="js/api.js"></script>
<script>
const statusEl = document.getElementById('status');
const contentEl = document.getElementById('content');

let CATEGORIES = [];
let LOCATIONS = [];
let ACTIVITIES = [];
let GOALS = [];
let PEOPLE = [];
let TAGS = [];
let LEARNING_PROJECTS = [];

const GOAL_TYPE_OPTS = ['Minimum', 'Target', 'Maximum', 'TrackOnly'];
const CADENCE_TYPE_OPTS = ['Daily', 'Weekly', 'Monthly'];

function showStatus(msg) {
  if (!msg) { statusEl.style.display = 'none'; return; }
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
}

function txt(col, value, opts) {
  opts = opts || {};
  const type = opts.type || 'text';
  const v = value ?? '';
  return `<input type="${type}" data-col="${col}" value="${escapeHtml(v)}" ${opts.attrs || ''}>`;
}
function chk(col, checked) {
  return `<input type="checkbox" data-col="${col}" ${checked ? 'checked' : ''}>`;
}
function selectOptions(col, items, valueKey, labelKey, selected, blankLabel) {
  const opts = (blankLabel !== undefined ? [`<option value="">${blankLabel}</option>`] : [])
    .concat(items.map(i => `<option value="${i[valueKey]}" ${String(i[valueKey]) === String(selected) ? 'selected' : ''}>${escapeHtml(i[labelKey])}</option>`));
  return `<select data-col="${col}">${opts.join('')}</select>`;
}
function plainSelect(col, options, selected) {
  return `<select data-col="${col}">${options.map(o => `<option value="${o}" ${o === selected ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
}
function multiSelectOptions(col, items, valueKey, labelKey, selectedIds) {
  const selectedSet = new Set((selectedIds || []).map(String));
  const opts = items.map(i => `<option value="${i[valueKey]}" ${selectedSet.has(String(i[valueKey])) ? 'selected' : ''}>${escapeHtml(i[labelKey])}</option>`).join('');
  return `<select data-col="${col}" multiple size="${Math.min(5, Math.max(3, items.length))}">${opts}</select>`;
}
function readRow(tr) {
  const out = {};
  tr.querySelectorAll('[data-col]').forEach(el => {
    const col = el.dataset.col;
    if (el.type === 'checkbox') { out[col] = el.checked; }
    else if (el.type === 'select-multiple') { out[col] = Array.from(el.selectedOptions).map(o => o.value); }
    else { out[col] = el.value; }
  });
  return out;
}

// ---------------- Categories ----------------

function renderCategories() {
  const rows = CATEGORIES.map(c => `
    <tr data-id="${c.Id}" class="${c.Active ? '' : 'inactive-row'}">
      <td>${txt('name', c.Name)}</td>
      <td>${txt('description', c.Description)}</td>
      <td>${txt('sortOrder', c.SortOrder, { type: 'number' })}</td>
      <td>${chk('active', c.Active)}</td>
      <td><button class="btn" data-act="save-cat">Save</button></td>
    </tr>`).join('');
  const addRow = `
    <tr id="add-cat">
      <td>${txt('name', '')}</td>
      <td>${txt('description', '')}</td>
      <td>${txt('sortOrder', 0, { type: 'number' })}</td>
      <td>${chk('active', true)}</td>
      <td><button class="btn" data-act="add-cat">Add</button></td>
    </tr>`;
  return `
    <div class="table-wrap">
      <table class="grid">
        <thead><tr><th>Name</th><th>Description</th><th>Sort</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody>${rows}${addRow}</tbody>
      </table>
    </div>`;
}

async function handleCategoryAction(btn) {
  const act = btn.dataset.act;
  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.name.trim()) { showStatus('Category name is required.'); return; }
  const payload = { name: data.name.trim(), description: data.description, sortOrder: Number(data.sortOrder) || 0, active: data.active };
  btn.disabled = true;
  try {
    if (act === 'add-cat') {
      await postAction('addCategory', payload);
    } else {
      await postAction('updateCategory', { id: Number(tr.dataset.id), ...payload });
    }
    await reloadAll();
  } catch (e) {
    showStatus(e.message === 'not-authorized' ? "You're not authorized to do that." : "Couldn't save that category.");
    btn.disabled = false;
  }
}

// ---------------- Locations ----------------

function renderLocations() {

    <tr data-id="${l.Id}" class="${l.Active ? '' : 'inactive-row'}">
      <td>${txt('name', l.Name)}</td>
      <td>${txt('locationType', l.LocationType)}</td>
      <td>${txt('address', l.Address)}</td>
      <td>${txt('city', l.City)}</td>
      <td>${txt('stateRegion', l.StateRegion)}</td>
      <td>${txt('phone', l.Phone)}</td>
      <td>${txt('websiteUrl', l.WebsiteUrl, { type: 'url' })}</td>
      <td>${chk('active', l.Active)}</td>
      <td><button class="btn" data-act="save-loc">Save</button></td>
    </tr>`).join('');
  const addRow = `
    <tr id="add-loc">
      <td>${txt('name', '')}</td>
      <td>${txt('locationType', '')}</td>
      <td>${txt('address', '')}</td>
      <td>${txt('city', '')}</td>
      <td>${txt('stateRegion', '')}</td>
      <td>${txt('phone', '')}</td>
      <td>${txt('websiteUrl', '', { type: 'url' })}</td>
      <td>${chk('active', true)}</td>
      <td><button class="btn" data-act="add-loc">Add</button></td>
    </tr>`;
  return `
    <div class="table-wrap">
      <table class="grid">
        <thead><tr><th>Name</th><th>Type</th><th>Address</th><th>City</th><th>State</th><th>Phone</th><th>Website</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody>${rows}${addRow}</tbody>
      </table>
    </div>`;
}

async function handleLocationAction(btn) {
  const act = btn.dataset.act;
  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.name.trim()) { showStatus('Location name is required.'); return; }
  btn.disabled = true;
  try {
    if (act === 'add-loc') {
      await postAction('addLocation', data);

      await postAction('updateLocation', { id: Number(tr.dataset.id), ...data });
    }
    await reloadAll();
  } catch (e) {
    showStatus("Couldn't save that location.");
    btn.disabled = false;
  }
}

// ---------------- Activities ----------------

function renderActivities() {
  const rows = ACTIVITIES.map(a => `
    <tr data-id="${a.Id}" class="${a.Active ? '' : 'inactive-row'}">
      <td>${txt('name', a.Name)}</td>
      <td>${selectOptions('categoryId', CATEGORIES.filter(c => c.Active), 'Id', 'Name', a.CategoryId, '(none)')}</td>
      <td>${txt('description', a.Description)}</td>
      <td>${txt('typicalDurationMinutes', a.TypicalDurationMinutes, { type: 'number' })}</td>
      <td>${chk('productive', a.Productive)}</td>
      <td>${chk('billableEligible', a.BillableEligible)}</td>
      <td>${selectOptions('defaultLocationId', LOCATIONS.filter(l => l.Active), 'Id', 'Name', a.DefaultLocationId, '(none)')}</td>
      <td>${chk('quickLog', a.QuickLog)}</td>
      <td>${chk('active', a.Active)}</td>
      <td><button class="btn" data-act="save-act">Save</button></td>
    </tr>`).join('');
  const addRow = `
    <tr id="add-act">
      <td>${txt('name', '')}</td>
      <td>${selectOptions('categoryId', CATEGORIES.filter(c => c.Active), 'Id', 'Name', '', '(none)')}</td>
      <td>${txt('description', '')}</td>
      <td>${txt('typicalDurationMinutes', '', { type: 'number' })}</td>
      <td>${chk('productive', false)}</td>
      <td>${chk('billableEligible', false)}</td>
      <td>${selectOptions('defaultLocationId', LOCATIONS.filter(l => l.Active), 'Id', 'Name', '', '(none)')}</td>
      <td>${chk('quickLog', false)}</td>
      <td>${chk('active', true)}</td>
      <td><button class="btn" data-act="add-act">Add</button></td>
    </tr>`;
  return `
    <div class="table-wrap">
      <table class="grid">
        <thead><tr>
          <th>Name</th><th>Category</th><th>Description</th><th>Typical min</th>
          <th>Productive</th><th>Billable</th><th>Default location</th><th>Quick Log</th><th>Active</th><th>Actions</th>
        </tr></thead>
        <tbody>${rows}${addRow}</tbody>
      </table>
    </div>`;
}

async function handleActivityAction(btn) {
  const act = btn.dataset.act;
  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.name.trim()) { showStatus('Activity name is required.'); return; }
  btn.disabled = true;
  try {
    if (act === 'add-act') {
      await postAction('addActivity', data);
    } else {
      await postAction('updateActivity', { id: Number(tr.dataset.id), ...data });
    }
    await reloadAll();
  } catch (e) {
    showStatus("Couldn't save that activity.");
    btn.disabled = false;
  }
}

// ---------------- Goals ----------------

function renderGoals() {
  const activeActivities = ACTIVITIES.filter(a => a.Active);
  const rows = GOALS.map(g => `
    <tr data-id="${g.Id}" class="${g.Active ? '' : 'inactive-row'}">
      <td>${txt('name', g.Name)}</td>
      <td>${plainSelect('goalType', GOAL_TYPE_OPTS, g.GoalType)}</td>
      <td>${plainSelect('cadenceType', CADENCE_TYPE_OPTS, g.CadenceType)}</td>
      <td>${txt('targetValue', g.TargetValue, { type: 'number', attrs: 'step="0.5" min="0"' })}</td>
      <td>${txt('weight', g.Weight, { type: 'number', attrs: 'step="0.1" min="0.1"' })}</td>
      <td>${multiSelectOptions('activityIds', activeActivities, 'Id', 'Name', g.ActivityIds)}</td>
      <td>${chk('active', g.Active)}</td>
      <td><button class="btn" data-act="save-goal">Save</button></td>
    </tr>`).join('');
  const addRow = `
    <tr id="add-goal">
      <td>${txt('name', '')}</td>
      <td>${plainSelect('goalType', GOAL_TYPE_OPTS, 'Target')}</td>
      <td>${plainSelect('cadenceType', CADENCE_TYPE_OPTS, 'Weekly')}</td>
      <td>${txt('targetValue', '', { type: 'number', attrs: 'step="0.5" min="0"' })}</td>
      <td>${txt('weight', 1, { type: 'number', attrs: 'step="0.1" min="0.1"' })}</td>
      <td>${multiSelectOptions('activityIds', activeActivities, 'Id', 'Name', [])}</td>
      <td>${chk('active', true)}</td>
      <td><button class="btn" data-act="add-goal">Add</button></td>
    </tr>`;
  return `
    <div class="table-wrap">
      <table class="grid">
        <thead><tr>
          <th>Name</th><th>Type</th><th>Cadence</th><th>Target</th><th>Weight</th><th>Counts activities</th><th>Active</th><th>Actions</th>
        </tr></thead>
        <tbody>${rows}${addRow}</tbody>
      </table>
    </div>`;
}

async function handleGoalAction(btn) {
  const act = btn.dataset.act;
  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.name.trim()) { showStatus('Goal name is required.'); return; }
  const payload = {
    name: data.name.trim(),
    goalType: data.goalType,
    cadenceType: data.cadenceType,
    targetValue: data.targetValue,
    weight: data.weight,
    activityIds: data.activityIds,
    active: data.active,
  };
  btn.disabled = true;
  try {
    if (act === 'add-goal') {
      await postAction('addGoal', payload);
    } else {
      await postAction('updateGoal', { id: Number(tr.dataset.id), ...payload });
    }
    await reloadAll();
  } catch (e) {
    showStatus("Couldn't save that goal.");
    btn.disabled = false;
  }
}

// ---------------- People ----------------

const RELATIONSHIP_OPTS = ['', 'Spouse', 'Child', 'Grandchild', 'Friend', 'Family', 'Other'];

function renderPeople() {
  const rows = PEOPLE.map(p => `
    <tr data-id="${p.Id}" class="${p.Active ? '' : 'inactive-row'}">
      <td>${txt('displayName', p.DisplayName)}</td>
      <td>${selectOptions('relationshipType', RELATIONSHIP_OPTS.filter(r => r).map(r => ({ v: r })), 'v', 'v', p.RelationshipType, '(none)')}</td>
      <td>${chk('active', p.Active)}</td>
      <td><button class="btn" data-act="save-person">Save</button></td>
    </tr>`).join('');
  const addRow = `
    <tr id="add-person">
      <td>${txt('displayName', '')}</td>
      <td>${selectOptions('relationshipType', RELATIONSHIP_OPTS.filter(r => r).map(r => ({ v: r })), 'v', 'v', '', '(none)')}</td>
      <td>${chk('active', true)}</td>
      <td><button class="btn" data-act="add-person">Add</button></td>
    </tr>`;
  return `
    <div class="table-wrap">
      <table class="grid">
        <thead><tr><th>Name</th><th>Relationship</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody>${rows}${addRow}</tbody>
      </table>
    </div>`;
}

async function handlePersonAction(btn) {
  const act = btn.dataset.act;
  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.displayName.trim()) { showStatus('Person name is required.'); return; }
  btn.disabled = true;
  try {
    if (act === 'add-person') {
      await postAction('addPerson', data);
    } else {
      await postAction('updatePerson', { id: Number(tr.dataset.id), ...data });
    }

  } catch (e) {
    showStatus("Couldn't save that person.");
    btn.disabled = false;

}

async function handleTagAction(btn) {
  const act = btn.dataset.act;
  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.name.trim()) { showStatus('Tag name is required.'); return; }
  btn.disabled = true;
  try {
    if (act === 'add-tag') {
      await postAction('addTag', data);
    } else {
      await postAction('updateTag', { id: Number(tr.dataset.id), ...data });

}

// ---------------- Learning Projects ----------------

function renderLearningProjects() {
  const rows = LEARNING_PROJECTS.map(lp => `
    <tr data-id="${lp.Id}" class="${lp.Active ? '' : 'inactive-row'}">
      <td>${txt('name', lp.Name)}</td>
      <td>${txt('description', lp.Description)}</td>
      <td>${chk('active', lp.Active)}</td>
      <td><button class="btn" data-act="save-lp">Save</button></td>
    </tr>`).join('');
  const addRow = `
    <tr id="add-lp">
      <td>${txt('name', '')}</td>
      <td>${txt('description', '')}</td>
      <td>${chk('active', true)}</td>
      <td><button class="btn" data-act="add-lp">Add</button></td>
    </tr>`;
  return `
    <div class="table-wrap">
      <table class="grid">
        <thead><tr><th>Name</th><th>Description</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody>${rows}${addRow}</tbody>

async function handleLearningProjectAction(btn) {

  const tr = btn.closest('tr');
  const data = readRow(tr);
  showStatus('');
  if (!data.name.trim()) { showStatus('Learning project name is required.'); return; }
  btn.disabled = true;

    } else {

    }
    await reloadAll();
  } catch (e) {

    btn.disabled = false;
  }
}

// ---------------- Shell ----------------

function render() {
  contentEl.innerHTML = `
    <div class="card">
      <h3>Categories</h3>
      <p class="note">Broad life areas (Health, Spiritual, Music, ...) used to group activities for later reporting.</p>
      <div id="cat-table">${renderCategories()}</div>
    </div>
    <div class="card">
      <h3>Locations</h3>
      <p class="note">Reusable places an activity can happen at (Temple, Gym, Rehearsal Hall, ...).</p>
      <div id="loc-table">${renderLocations()}</div>
    </div>
    <div class="card">
      <h3>Activities</h3>
      <p class="note">The things you actually log. Turn on Quick Log for the ones you do often — they'll get a one-tap button on Today.</p>
      <div id="act-table">${renderActivities()}</div>
    </div>
    <div class="card">
      <h3>Goals</h3>
      <p class="note">Compare actual activity against an intended rhythm (e.g. "Exercise 5 per week"). Link a goal to the activities that should count toward it, then check <a href="dashboard.html">Dashboard</a> for progress. Ctrl/Cmd-click to select multiple activities.</p>
      <div id="goal-table">${renderGoals()}</div>
    </div>
    <div class="card">
      <h3>People</h3>
      <p class="note">Who you do things with — link them to a log entry on Today/History to record participation.</p>
      <div id="person-table">${renderPeople()}</div>
    </div>
    <div class="card">
      <h3>Tags</h3>
      <p class="note">Freeform labels for a log entry (Outdoor, Music, ...) beyond its Category.</p>
      <div id="tag-table">${renderTags()}</div>
    </div>
    <div class="card">
      <h3>Learning Projects</h3>
      <p class="note">Group related learning (Photography, Genealogy, ...). Attach one to a log entry along with Learn/Apply to distinguish instruction from practice.</p>
      <div id="lp-table">${renderLearningProjects()}</div>
    </div>
  `;
  contentEl.querySelectorAll('[data-act^="save-cat"], [data-act="add-cat"]').forEach(b => b.addEventListener('click', () => handleCategoryAction(b)));
  contentEl.querySelectorAll('[data-act^="save-loc"], [data-act="add-loc"]').forEach(b => b.addEventListener('click', () => handleLocationAction(b)));
  contentEl.querySelectorAll('[data-act^="save-act"], [data-act="add-act"]').forEach(b => b.addEventListener('click', () => handleActivityAction(b)));
  contentEl.querySelectorAll('[data-act^="save-goal"], [data-act="add-goal"]').forEach(b => b.addEventListener('click', () => handleGoalAction(b)));
  contentEl.querySelectorAll('[data-act^="save-person"], [data-act="add-person"]').forEach(b => b.addEventListener('click', () => handlePersonAction(b)));
  contentEl.querySelectorAll('[data-act^="save-tag"], [data-act="add-tag"]').forEach(b => b.addEventListener('click', () => handleTagAction(b)));
  contentEl.querySelectorAll('[data-act^="save-lp"], [data-act="add-lp"]').forEach(b => b.addEventListener('click', () => handleLearningProjectAction(b)));
}

async function reloadAll() {
  const [catRes, locRes, actRes, goalRes, personRes, tagRes, lpRes] = await Promise.all([
    fetchData('categories'), fetchData('locations'), fetchData('activities'), fetchData('goals'),
    fetchData('people'), fetchData('tags'), fetchData('learningProjects'),
  ]);
  CATEGORIES = (catRes && catRes.categories) || [];
  LOCATIONS = (locRes && locRes.locations) || [];
  ACTIVITIES = (actRes && actRes.activities) || [];
  GOALS = (goalRes && goalRes.goals) || [];
  PEOPLE = (personRes && personRes.people) || [];
  TAGS = (tagRes && tagRes.tags) || [];
  LEARNING_PROJECTS = (lpRes && lpRes.learningProjects) || [];
  render();
}

(async () => {
  await captureSso();
  try {
    await reloadAll();
  } catch (e) {
    handleError(contentEl, e);
  }
})();
</script>

</body>
</html>
